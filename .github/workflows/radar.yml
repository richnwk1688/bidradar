name: 標案雷達

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install
        run: pip install requests

      - name: run radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python radar.py

      - name: save state
        run: |
          git config user.name "bidradar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json hits.json docs
          git diff --cached --quiet || git commit -m "radar update"
          git push
